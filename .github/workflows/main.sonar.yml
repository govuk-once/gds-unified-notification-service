name: Sonar Scan
on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Setup
      - name: ⚙️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Fetch all history to support sonar scanning
          persist-credentials: false

      - name: ⚙️ Setup
        uses: ./.github/actions/setup
        with:
          role-to-assume: ${{ secrets.AWS_CODEARTIFACT_ROLE_ARN }}
          codeartifact-account-id: ${{ secrets.AWS_CODEARTIFACT_ACCOUNT_ID }}

      # Generate coverage
      - name: 🧪 Run Unit tests
        id: unittests
        run: pnpm run test:coverage

      # Perform scan
      - name: 🕵🏻 Run SonarQube Scan
        id: sonar-scan
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_UNS }}
          SONAR_HOST_URL: ${{ secrets.SONAR_URL }}

      - name: SonarCloud Security Findings to Jira
        continue-on-error: true
        if: >-
          ${{
            always() &&
            !cancelled() &&
            github.event_name == 'push' &&
            github.ref == 'refs/heads/main'
          }}
        env:
          SONAR_URL: ${{ secrets.SONAR_URL }}
          SONAR_TOKEN_UNS: ${{ secrets.SONAR_TOKEN_UNS }}
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          DRY_RUN: 'false'
        run: |
          pnpm exec tsx scripts/sonarToJira.ts
