name: Running Zap Security Scan

permissions:
  contents: read
  id-token: write
  pull-requests: write

on:
  workflow_call:
    inputs:
      scan-mode:
        description: 'passive(PR) or active (nightly)'
        required: true
        type: string
      environment:
        description: 'Github environment'
        required: true
        type: string
      env-identifier:
        description: 'Needed to set source bucket and project name'
        required: true
        type: string

jobs:
  zaproxyScan:
    name: Running Zap Security Scan (Mode -> ${{ inputs.scan-mode }})
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    env:
      SOURCE_BUCKET: uns-${{ inputs.env-identifier }}-e2e-runner-builds
      PROJECT_NAME: uns-${{ inputs.env-identifier }}-e2e-runner-project
    steps:
      - name: ⚙️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show OIDC claims (right before assume)
        if: ${{ runner.debug }}
        env:
          AUDIENCE: 'sts.amazonaws.com'
        run: |
          TOKEN_JSON=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE")
          ID_TOKEN=$(echo "$TOKEN_JSON" | jq -r .value)
          echo "$ID_TOKEN" | awk -F. '{print $2}' | base64 -d 2>/dev/null | jq -r '.sub'

      - name: ⚙️ Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          audience: sts.amazonaws.com
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: ⚙️ Configure Codeartifact
        run: aws codeartifact login --tool npm --repository registry-prod-repo --domain registry-prod --domain-owner ${{ secrets.AWS_CODEARTIFACT_ACCOUNT_ID }} --region eu-west-2

      - name: ⚙️ Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: pnpm

      - name: ⚙️ Install Dependencies
        run: pnpm ci

      - name: 🔐 Resolve ZAP environment variables
        id: zap_env
        env:
          env: ${{ inputs.env-identifier }}
          UNS_E2E_RUNNER: 'true'
        run: |
          set -e

          PSO_OUTPUT=$(pnpm --silent tsx scripts/configureZaproxyEnv.ts --target pso)
          eval "$PSO_OUTPUT"
          echo "pso_target_url=${TARGET_URL}" >> "$GITHUB_OUTPUT"
          echo "pso_x_api_key=${X_API_KEY}" >> "$GITHUB_OUTPUT"
          echo "tls_password=${TLS_PASSWORD}" >> "$GITHUB_OUTPUT"

          FLEX_OUTPUT=$(pnpm --silent tsx scripts/configureZaproxyEnv.ts --target flex)
          eval "$FLEX_OUTPUT"
          echo "flex_target_url=${TARGET_URL}" >> "$GITHUB_OUTPUT"
          echo "flex_x_api_key=${X_API_KEY}" >> "$GITHUB_OUTPUT"

      - name: 📤 Upload source code for the zaproxy scan
        id: upload
        env:
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          DATE=$(date +%Y-%m-%d)
          zip -rqy source.zip client.p12 infrastructure/cdk/buildspecs/* docs/pso/* docs/flex/*
          SOURCE_KEY="zaproxy/${DATE}/${REF}/${RUN_NUMBER}/source-${SHA:0:7}-${RUN_NUMBER}.zip"
          aws s3 cp source.zip "s3://${SOURCE_BUCKET}/$SOURCE_KEY"
          echo "source_key=${SOURCE_KEY}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"

      - name: 🧪 Run zap proxy batch scan in codebuild
        id: start
        env:
          SOURCE_KEY: ${{ steps.upload.outputs.source_key }}
          DATE: ${{ steps.upload.outputs.date }}
          REF: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          PSO_TARGET_URL: ${{ steps.zap_env.outputs.pso_target_url }}
          PSO_X_API_KEY: ${{ steps.zap_env.outputs.pso_x_api_key }}
          FLEX_TARGET_URL: ${{ steps.zap_env.outputs.flex_target_url }}
          FLEX_X_API_KEY: ${{ steps.zap_env.outputs.flex_x_api_key }}
          TLS_PASSWORD: ${{ steps.zap_env.outputs.tls_password }}
        run: |
          BATCH_ID=$(aws codebuild start-build-batch \
            --project-name "$PROJECT_NAME" \
            --source-location-override "${SOURCE_BUCKET}/${SOURCE_KEY}" \
            --buildspec-override "infrastructure/cdk/buildspecs/zaproxy.buildspec.yml" \
            --environment-variables-override \
              "name=BUILD_DATE,value=${DATE},type=PLAINTEXT" \
              "name=GITHUB_REF_NAME,value=${REF},type=PLAINTEXT" \
              "name=GITHUB_RUN_NUMBER,value=${RUN_NUMBER},type=PLAINTEXT" \
              "name=PSO_TARGET_URL,value=${PSO_TARGET_URL},type=PLAINTEXT" \
              "name=PSO_X_API_KEY,value=${PSO_X_API_KEY},type=PLAINTEXT" \
              "name=FLEX_TARGET_URL,value=${FLEX_TARGET_URL},type=PLAINTEXT" \
              "name=FLEX_X_API_KEY,value=${FLEX_X_API_KEY},type=PLAINTEXT" \
              "name=TLS_PASSWORD,value=${TLS_PASSWORD},type=PLAINTEXT" \
              "name=SCAN_MODE,value=${{ inputs.scan-mode }},type=PLAINTEXT" \
            --query 'buildBatch.id' --output text)
          echo "Batch build started: $BATCH_ID"
          echo "batch_id=${BATCH_ID}" >> "$GITHUB_OUTPUT"

      - name: ⏳ Wait for batch build to finish
        env:
          BATCH_ID: ${{ steps.start.outputs.batch_id }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          echo "Waiting for batch: $BATCH_ID"
          while true; do
            STATUS=$(aws codebuild batch-get-build-batches \
              --ids "$BATCH_ID" \
              --query 'buildBatches[0].buildBatchStatus' --output text)
            echo "Status: $STATUS"
            case "$STATUS" in
              SUCCEEDED) echo "Batch build succeeded"; break ;;
              FAILED|FAULT|TIMED_OUT|STOPPED)
                echo "::error::ZAP scan batch build finished with status: ${STATUS}"
                echo "::error::Logs: https://${AWS_REGION}.console.aws.amazon.com/codesuite/codebuild/projects/${PROJECT_NAME}/batch/${BATCH_ID}?region=${AWS_REGION}"
                exit 1
                ;;
            esac
            sleep 5
          done

      - name: 📥 Download ZAP report artifacts
        if: always()
        continue-on-error: true
        env:
          DATE: ${{ steps.upload.outputs.date }}
          REF: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          REPORT_PREFIX="zaproxy/${DATE}/${REF}/${RUN_NUMBER}/reports"
          echo "Downloading reports from: s3://${SOURCE_BUCKET}/${REPORT_PREFIX}/"
          mkdir -p zap-reports
          aws s3 cp "s3://${SOURCE_BUCKET}/${REPORT_PREFIX}/" ./zap-reports/ --recursive

      - name: 📝 Build combined report
        if: always()
        continue-on-error: true
        id: report
        env:
          DATE: ${{ steps.upload.outputs.date }}
          REF: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          BATCH_ID: ${{ steps.start.outputs.batch_id }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          PRIVATE_PREFIX="s3://${SOURCE_BUCKET}/zaproxy/${DATE}/${REF}/${RUN_NUMBER}/private-reports"
          {
            echo '## Zap Proxy Report'
            echo '<details><summary><b>PSO API</b></summary>'
            echo ''
            cat zap-reports/pso-zap-report.md
            echo ''
            echo '</details>'
            echo '<details><summary><b>FLEX API</b></summary>'
            echo ''
            cat zap-reports/flex-zap-report.md
            echo ''
            echo '</details>'
            echo '<details><summary><b>Private Reports & Logs</b></summary>'
            echo ''
            echo "- [View in S3](https://s3.console.aws.amazon.com/s3/buckets/${SOURCE_BUCKET}?region=${AWS_REGION}&prefix=zaproxy/${DATE}/${REF}/${RUN_NUMBER}/private-reports/)"
            echo "- [View Logs in CodeBuild](https://${AWS_REGION}.console.aws.amazon.com/codesuite/codebuild/projects/${PROJECT_NAME}/batch/${BATCH_ID}?region=${AWS_REGION})"
            echo ''
            echo '</details>'
          } >> zap-reports/comment.md

          # Adding multiline string delimiter
          echo "report<<EOF" >> "$GITHUB_OUTPUT"
          cat zap-reports/comment.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: 💬 Comment ZAP report on PR
        if: always() && inputs.environment == 'ephemeral'
        continue-on-error: true
        uses: hasura/comment-progress@146c635f3e325d478025e29e5043ec1c07c0e36c # v2.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: 'govuk-once/gds-unified-notification-service'
          number: ${{ github.event.number }}
          id: zapreportcomment
          recreate: true
          message: ${{ steps.report.outputs.report }}

      - name: Publish ZAP report to job summary
        if: always()
        run: cat zap-reports/comment.md >> "$GITHUB_STEP_SUMMARY"
