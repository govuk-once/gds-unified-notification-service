name: PR pipeline

on:
  # Trigger the workflow on pull request
  pull_request

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr:
    name: Pull request
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Setup
      - name: ⚙️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup
        uses: ./.github/actions/setup
        with:
          role-to-assume: ${{ secrets.AWS_CODEARTIFACT_ROLE_ARN }}
          codeartifact-account-id: ${{ secrets.AWS_CODEARTIFACT_ACCOUNT_ID }}

      - name: ⚙️ Restore TypeScript build cache
        uses: actions/cache@v4
        with:
          path: tsconfig.tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-${{ hashFiles('src/**/*.ts', 'tsconfig.json') }}
          restore-keys: tsbuildinfo-${{ runner.os }}-

      - parallel:
          - name: ⚙️ Validate Typescript
            run: pnpm run build:validate

          - name: 🔨 Build bundles
            run: pnpm run build

          - name: 🧪 Run Unit tests & report coverage
            id: unittests
            run: |
              echo "Test results:" > coverage.md
              echo '```' >> coverage.md
              (VITEST_TREE_REPORT=true pnpm run test:coverage 2>&1 | grep -A1000 "= Coverage summary =" | tee -a coverage.md) || echo "Failed to meet the criteria"
              echo '```' >> coverage.md

              echo 'report<<EOF' >> $GITHUB_OUTPUT
              cat coverage.md >> $GITHUB_OUTPUT
              echo 'EOF' >> $GITHUB_OUTPUT

      - parallel:
          - name: ⬆️ Upload dist artifact
            uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
            with:
              name: dist
              path: ./dist

          - name: ⬆️ Upload coverage artifact
            uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
            with:
              name: coverage.report
              path: ./coverage

          - name: 🧪 Create Comment with Test results
            uses: hasura/comment-progress@146c635f3e325d478025e29e5043ec1c07c0e36c # v2.3.0
            with:
              github-token: ${{ secrets.GITHUB_TOKEN }}
              repository: 'govuk-once/gds-unified-notification-service'
              number: ${{ github.event.number }}
              id: unittestscomment
              message: '${{ steps.unittests.outputs.report }}'
              recreate: true

  qualityReview:
    name: PR / Quality Review
    uses: ./.github/workflows/_quality.review.yml
    needs: [pr]
    secrets: inherit

  ephemeralTestingSetup:
    name: PR / Ephemeral Testing
    uses: ./.github/workflows/_ephemeral.setup.yml
    secrets: inherit

  ephemeralE2ETesting:
    name: Ephemeral testing
    uses: ./.github/workflows/_test_e2e.yml
    needs: [ephemeralTestingSetup]
    secrets: inherit
    with:
      ENVIRONMENT: ephemeral
      ENV_IDENTIFIER: ${{ github.event.pull_request.number }}

  zaproxyScan:
    name: PR / Zap Security Scan
    uses: ./.github/workflows/_zaproxy.yml
    needs: [ephemeralTestingSetup]
    secrets: inherit
    with:
      scan-mode: passive
      env-identifier: ${{ github.event.pull_request.number }}
      environment: ephemeral
