name: Unit Tests

permissions:
  contents: read
  id-token: write

on:
  workflow_call:
    outputs:
      report:
        description: 'Coverage report for PR comments'
        value: ${{ jobs.test.outputs.report }}

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      report: ${{ steps.unittests.outputs.report }}
    steps:
      - name: ⚙️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup
        uses: ./.github/actions/setup
        with:
          role-to-assume: ${{ secrets.AWS_CODEARTIFACT_ROLE_ARN }}
          codeartifact-account-id: ${{ secrets.AWS_CODEARTIFACT_ACCOUNT_ID }}

      - name: ⚙️ Restore TypeScript build cache
        uses: actions/cache@v4
        with:
          path: tsconfig.tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-${{ hashFiles('src/**/*.ts', 'tsconfig.json') }}
          restore-keys: tsbuildinfo-${{ runner.os }}-

      - name: 🧪 Run Unit tests & report coverage
        id: unittests
        run: |
          echo "Test results:" > coverage.md
          echo '```' >> coverage.md
          (VITEST_TREE_REPORT=true pnpm run test:coverage 2>&1 | grep -A1000 "= Coverage summary =" | tee -a coverage.md) || echo "Failed to meet the criteria"
          echo '```' >> coverage.md

          echo 'report<<EOF' >> $GITHUB_OUTPUT
          cat coverage.md >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

      - name: ⬆️ Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: coverage.report
          path: ./coverage
