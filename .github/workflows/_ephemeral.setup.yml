name: Ephemeral Testing

permissions:
  contents: read
  id-token: write

on: workflow_call

jobs:
  ephemeralTestingSetup:
    name: 🏗️ Setup Ephemeral Environment
    runs-on: ubuntu-latest
    environment:
      name: ephemeral
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 60
    steps:
      # Setup
      - name: ⚙️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup
        uses: ./.github/actions/setup
        with:
          role-to-assume: ${{ secrets.AWS_CODEARTIFACT_ROLE_ARN }}
          codeartifact-account-id: ${{ secrets.AWS_CODEARTIFACT_ACCOUNT_ID }}

      - name: ⚙️ Configure AWS deploy credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          audience: sts.amazonaws.com
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: 🔨 Build bundles
        run: pnpm run build

      - name: 🏗️ CDK Deploy Ephemeral Build
        run: |
          pnpm run cdk:predeploy:ssm && pnpm run cdk deploy --require-approval never --all
        env:
          pr_number: ${{ github.event.number }}
          region: ${{ vars.AWS_REGION }}
          env: ${{ github.event.number }}
          code_version: pr-${{ github.event.number }}
