name: Release to env

permissions:
  contents: read
  id-token: write

on:
  workflow_call:
    inputs:
      ENVIRONMENT:
        description: 'Github environment to use'
        type: string
        required: true
      VERSION:
        description: 'Version label'
        type: string
        required: true

jobs:
  e2e:
    if: ${{ inputs.ENVIRONMENT != 'production' }}
    needs: release
    name: E2E in Codebuild (using Private Api Gateway),
    uses: ./.github/workflows/_test_e2e.yml
    with:
      ENVIRONMENT: ${{ inputs.ENVIRONMENT }}
    secrets: inherit
  release:
    name: Release
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.ENVIRONMENT }}
    timeout-minutes: 60
    steps:
      # Setup
      - name: ⚙️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup
        uses: ./.github/actions/setup
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          codeartifact-account-id: ${{ secrets.AWS_CODEARTIFACT_ACCOUNT_ID }}

      # Build & release
      - name: 🔨 Build bundles
        run: pnpm run build

      # CDK Needs initialisation for first time in each AWS Account & Region
      # This ensures relevant regions are enabled - can be commented out in the future if the regions are unchanged
      # eu-west-2 holds all of our resources, however us-east-1 needs enabling in order to support CloudFront
      - name: 🔍 Check & Ensure CDK Bootstrap
        env:
          TARGET_REGIONS: 'eu-west-2 us-east-1'
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          for REGION in $TARGET_REGIONS; do
            echo "Checking bootstrap status for ${REGION}..."

            BOOTSTRAP_VERSION=$(aws ssm get-parameter \
              --name "/cdk-bootstrap/hnb659fds/version" \
              --region "$REGION" \
              --query "Parameter.Value" \
              --output text 2>/dev/null || echo "0")

            if [ "$BOOTSTRAP_VERSION" -eq "0" ]; then
              echo "⚠️ Region ${REGION} is not bootstrapped. Running bootstrap..."
              pnpm exec cdk bootstrap "aws://${ACCOUNT_ID}/${REGION}"
            else
              echo "✅ Region ${REGION} is already bootstrapped (Version: ${BOOTSTRAP_VERSION})."
            fi
          done

      - name: 🏗️ CDK Deploy
        run: |
          pnpm run cdk:deploy
        env:
          region: ${{ vars.AWS_REGION }}
          env: '${{ vars.ENVIRONMENT_SHORTHAND }}'
          code_version: ${{ inputs.VERSION }}
          use_mtls: 'true'
          is_main_environment_in_account: 'true'
          SSM_PARAMETERS_TO_UPDATE: ${{ vars.SSM_PARAMETERS_TO_UPDATE }}

      - name: 🎉 Announce release
        id: announce
        background: true
        continue-on-error: true
        env:
          region: ${{ vars.AWS_REGION }}
          env: '${{ vars.ENVIRONMENT_SHORTHAND }}'
          code_version: ${{ inputs.VERSION }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          pnpm run release:announcement
