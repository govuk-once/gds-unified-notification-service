name: Running Zap Security Scan

permissions:
  contents: read
  id-token: write
  pull-requests: write

on: workflow_call

jobs:
  zaproxyScan:
    name: Running Zap Security Scan
    runs-on: ubuntu-latest
    environment:
      name: ephemeral
    env:
      SOURCE_BUCKET: uns-${{ vars.ENVIRONMENT_SHORTHAND }}-e2e-runner-builds
      PROJECT_NAME: uns-${{ vars.ENVIRONMENT_SHORTHAND }}-e2e-runner-project
    steps:
      - name: ⚙️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show OIDC claims (right before assume)
        if: ${{ runner.debug }}
        env:
          AUDIENCE: 'sts.amazonaws.com'
        run: |
          TOKEN_JSON=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE")
          ID_TOKEN=$(echo "$TOKEN_JSON" | jq -r .value)
          echo "$ID_TOKEN" | awk -F. '{print $2}' | base64 -d 2>/dev/null | jq -r '.sub'

      - name: ⚙️ Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          audience: sts.amazonaws.com
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: 📤 Upload source code for the zaproxy scan
        id: upload
        env:
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          DATE=$(date +%Y-%m-%d)
          zip -rqy source.zip .
          SOURCE_KEY="zaproxy/${DATE}/${REF}/source-${SHA:0:7}-${RUN_NUMBER}.zip"
          aws s3 cp source.zip "s3://${SOURCE_BUCKET}/$SOURCE_KEY"
          echo "source_key=${SOURCE_KEY}" >> "$GITHUB_OUTPUT"

      - name: 🧪 Run zap proxy scan in codebuild
        id: start
        env:
          SOURCE_KEY: ${{ steps.upload.outputs.source_key }}
        run: |
          BUILD_ID=$(aws codebuild start-build \
            --project-name "$PROJECT_NAME" \
            --source-location-override "${SOURCE_BUCKET}/${SOURCE_KEY}" \
            --buildspec-override "infrastructure/cdk/buildspecs/zaproxy.buildspec.yml" \
            --query 'build.id' --output text)
          echo "Build started: $BUILD_ID"
          echo "build_id=${BUILD_ID}" >> "$GITHUB_OUTPUT"

      - name: ⏳ Wait for CodeBuild to finish
        id: wait
        env:
          BUILD_ID: ${{ steps.start.outputs.build_id }}
        run: |
          echo "Waiting for build: $BUILD_ID"
          while true; do
            STATUS=$(aws codebuild batch-get-builds \
              --ids "$BUILD_ID" \
              --query 'builds[0].buildStatus' --output text)
            echo "Status: $STATUS"
            case "$STATUS" in
              SUCCEEDED) echo "Build succeeded"; break ;;
              FAILED|FAULT|TIMED_OUT|STOPPED)
                echo "::error::CodeBuild finished with status: $STATUS"
                exit 1
                ;;
            esac
            sleep 30
          done

      - name: 📥 Download ZAP report artifacts
        env:
          BUILD_ID: ${{ steps.start.outputs.build_id }}
        run: |
          ARTIFACTS_LOC=$(aws codebuild batch-get-builds \
            --ids "$BUILD_ID" \
            --query 'builds[0].artifacts.location' --output text)
          echo "Downloading artifacts from: $ARTIFACTS_LOC"
          mkdir -p zap-reports
          aws s3 cp "$ARTIFACTS_LOC" ./zap-reports/ --recursive

      - name: 📎 Upload artifacts to GitHub
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-report
          path: zap-reports/
