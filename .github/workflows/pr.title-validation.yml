on: pull_request

jobs:
  validate-pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Skip Dependabot PRs
        if: github.actor == 'dependabot[bot]'
        run: echo "Skipping Jira title check for Dependabot"

      - name: Validate PR title follows conventional commits
        if: github.actor != 'dependabot[bot]'
        env:
          # Passed via env rather than interpolated into the script to avoid shell injection from PR titles
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Checking PR title: $TITLE"

          # Must stay in sync with scripts/validate-commit-msg.ts (the source of truth)
          PATTERN='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test|BREAKING CHANGE|BREAKING)\([A-Z]{1,6}-[0-9]{1,5}\): .+'
          if [[ ! $TITLE =~ $PATTERN ]]; then
            echo "::error ::PR title must follow the format: <type>(<TICKET-123>): <description>"
            echo "::error ::Valid types: build, chore, ci, docs, feat, fix, perf, refactor, revert, style, test, BREAKING CHANGE, BREAKING"
            echo "::error ::Examples: 'feat(NOT-491): add login flow' or 'BREAKING CHANGE(NOT-123): remove legacy endpoint'"
            exit 1
          fi
