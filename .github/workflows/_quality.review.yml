name: Code Quality Review

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

on: workflow_call

jobs:
  codeQualityReview:
    name: Code Quality Review
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Setup
      - name: ⚙️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: ⚙️ Configure AWS credentials (For package registry pulling)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          audience: sts.amazonaws.com
          role-to-assume: ${{ secrets.AWS_CODEARTIFACT_ROLE_ARN }}
          aws-region: eu-west-2

      - name: ⚙️ Configure Codeartifact
        run: aws codeartifact login --tool npm --repository registry-prod-repo --domain registry-prod --domain-owner ${{ secrets.AWS_CODEARTIFACT_ACCOUNT_ID }} --region eu-west-2

      - name: ⚙️ Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: ⚙️ Install Dependencies
        run: pnpm ci

      - name: 🔨 Build bundles
        run: pnpm run build

      # CDK Validation - Explicitly overwriting AWS env vars so CDK:SYNTH ignores assumed role
      - name: 🏗️ CDK Synth (mock env)
        run: |
          env=cicd AWS_REGION=eu-west-2 AWS_DEFAULT_REGION=eu-west-2 AWS_ACCESS_KEY_ID="" AWS_SECRET_ACCESS_KEY="" AWS_SESSION_TOKEN="" pnpm run cdk:synth

      - name: 🔐 Checkov GitHub Action
        if: success()
        uses: bridgecrewio/checkov-action@a8664e3a0549367977f0cda990a34311835c87c0 # v12
        with:
          output_format: cli,sarif
          output_file_path: console,results.sarif
          soft_fail: true
          framework: cloudformation
          directory: infrastructure/cdk/cdk.out/
          config_file: .checkov.yaml
          quiet: true

      - name: ⚙️ Upload SARIF file
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        if: success() || failure()
        with:
          sarif_file: results.sarif

      # SonarQube - Scan, Gate, Report
      - name: 🕵🏻 Run SonarQube Scan
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_UNS }}
          SONAR_HOST_URL: ${{ secrets.SONAR_URL }}

      - name: 🕵🏻 SonarQube Quality Gate check
        id: sonarqube-quality-gate-check
        uses: sonarsource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        if: success() || failure()
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_UNS }}
          SONAR_HOST_URL: ${{ secrets.SONAR_URL }}

      - name: 🕵🏻 Create Comment with SonarQube's Quality Gate
        continue-on-error: true
        uses: hasura/comment-progress@146c635f3e325d478025e29e5043ec1c07c0e36c # v2.3.0
        if: success() || failure()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: 'govuk-once/gds-unified-notification-service'
          number: ${{ github.event.number }}
          id: qualitygatecomment
          message: 'SonarQube Quality Gate Status: ${{steps.sonarqube-quality-gate-check.outputs.quality-gate-status}} [LINK](https://sonarcloud.io/summary/new_code?id=govuk-once_gds-unified-notification-service&pullRequest=${{github.event.number}})'
          recreate: true
