name: Code Quality Review

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

on: workflow_call

jobs:
  lintAndSpellCheck:
    name: 🧪 Lint & Spell Check
    runs-on: ubuntu-latest
    steps:
      - name: ⚙️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: ⚙️ Setup
        uses: ./.github/actions/setup
        with:
          role-to-assume: ${{ secrets.AWS_CODEARTIFACT_ROLE_ARN }}
          codeartifact-account-id: ${{ secrets.AWS_CODEARTIFACT_ACCOUNT_ID }}

      - name: ⚙️ Restore ESLint cache
        uses: actions/cache@v4
        with:
          path: .eslintcache
          key: eslintcache-${{ runner.os }}-${{ hashFiles('src/**/*.ts', 'eslint.config.ts') }}
          restore-keys: eslintcache-${{ runner.os }}-

      - parallel:
          - name: 🧪 Run Lint
            run: pnpm run lint

          - name: 🧪 Spell Check
            run: pnpm run spellcheck

  unitTests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: ⚙️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup
        uses: ./.github/actions/setup
        with:
          role-to-assume: ${{ secrets.AWS_CODEARTIFACT_ROLE_ARN }}
          codeartifact-account-id: ${{ secrets.AWS_CODEARTIFACT_ACCOUNT_ID }}

      - name: 🧪 Run Unit tests & report coverage
        id: unittests
        run: |
          echo "Test results:" > coverage.md
          echo '```' >> coverage.md
          (VITEST_TREE_REPORT=true pnpm run test:coverage 2>&1 | grep -A1000 "= Coverage summary =" | tee -a coverage.md) || echo "Failed to meet the criteria"
          echo '```' >> coverage.md

          echo 'report<<EOF' >> $GITHUB_OUTPUT
          cat coverage.md >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

      - parallel:
          - name: ⬆️ Upload coverage artifact
            uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
            with:
              name: coverage.report
              path: ./coverage

          - name: 🧪 Create Comment with Test results
            uses: hasura/comment-progress@146c635f3e325d478025e29e5043ec1c07c0e36c # v2.3.0
            with:
              github-token: ${{ secrets.GITHUB_TOKEN }}
              repository: 'govuk-once/gds-unified-notification-service'
              number: ${{ github.event.number }}
              id: unittestscomment
              message: '${{ steps.unittests.outputs.report }}'
              recreate: true

  sonarReview:
    name: 🧪 Sonar Quality Review
    needs: [unitTests]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: ⚙️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: ⬇️ Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage.report
          path: ./coverage

      - name: 🕵🏻 Run SonarQube Scan
        id: sonar-scan
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_UNS }}
          SONAR_HOST_URL: ${{ secrets.SONAR_URL }}
      - name: 🧪 SonarQube Quality Gate check
        id: sonarqube-quality-gate-check
        uses: sonarsource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        if: success() || failure()
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_UNS }}
          SONAR_HOST_URL: ${{ secrets.SONAR_URL }}

  checkovCheck:
    name: 🧪 Checkov Check
    runs-on: ubuntu-latest
    steps:
      - name: ⚙️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⚙️ Setup
        uses: ./.github/actions/setup
        with:
          role-to-assume: ${{ secrets.AWS_CODEARTIFACT_ROLE_ARN }}
          codeartifact-account-id: ${{ secrets.AWS_CODEARTIFACT_ACCOUNT_ID }}

      - name: ⬇️ Download dist artifact
        id: download-dist
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: ./dist
      - name: 🔨 Build bundles
        if: steps.download-dist.outcome == 'failure'
        run: pnpm run build
      - name: 🧪 CDK Synth (mock env)
        run: |
          env=cicd AWS_REGION=eu-west-2 AWS_DEFAULT_REGION=eu-west-2 AWS_ACCESS_KEY_ID="" AWS_SECRET_ACCESS_KEY="" AWS_SESSION_TOKEN="" pnpm run cdk:synth

      - name: 🔐 Checkov GitHub Action
        uses: bridgecrewio/checkov-action@f967808197a8d784d3e72919f38c3ff0cda7884e # v12
        with:
          output_format: cli,sarif
          output_file_path: console,results.sarif
          soft_fail: true
          framework: cloudformation
          directory: infrastructure/cdk/cdk.out/
          config_file: .checkov.yaml
          quiet: true

      - name: ⚙️ Upload SARIF file
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: success() || failure()
        with:
          sarif_file: results.sarif
