name: Code Quality Review

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

on: workflow_call

jobs:
  lintAndSpellCheck:
    name: 🧪 Lint & Spell Check
    runs-on: ubuntu-latest
    steps:
      - name: ⚙️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: ⚙️ Setup
        uses: ./.github/actions/setup
        with:
          role-to-assume: ${{ secrets.AWS_CODEARTIFACT_ROLE_ARN }}
          codeartifact-account-id: ${{ secrets.AWS_CODEARTIFACT_ACCOUNT_ID }}

      - name: ⚙️ Restore ESLint cache
        uses: actions/cache@v4
        with:
          path: .eslintcache
          key: eslintcache-${{ runner.os }}-${{ hashFiles('src/**/*.ts', 'eslint.config.ts') }}
          restore-keys: eslintcache-${{ runner.os }}-

      - parallel:
          - name: 🧪 Run Lint
            run: pnpm run lint

          - name: 🧪 Spell Check
            run: pnpm run spellcheck

  sonarReview:
    name: 🧪 Sonar Quality Review
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: ⚙️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: ⬇️ Download coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage.report
          path: ./coverage

      - name: 🕵🏻 Run SonarQube Scan
        id: sonar-scan
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_UNS }}
          SONAR_HOST_URL: ${{ secrets.SONAR_URL }}
      - name: 🧪 SonarQube Quality Gate check
        id: sonarqube-quality-gate-check
        uses: sonarsource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        if: success() || failure()
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_UNS }}
          SONAR_HOST_URL: ${{ secrets.SONAR_URL }}

  checkovCheck:
    name: 🧪 Checkov Check
    runs-on: ubuntu-latest
    steps:
      - name: ⚙️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⚙️ Setup
        uses: ./.github/actions/setup
        with:
          role-to-assume: ${{ secrets.AWS_CODEARTIFACT_ROLE_ARN }}
          codeartifact-account-id: ${{ secrets.AWS_CODEARTIFACT_ACCOUNT_ID }}

      - name: ⬇️ Download dist artifact
        id: download-dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: ./dist

      - name: 🧪 CDK Synth (mock env)
        run: |
          env=cicd AWS_REGION=eu-west-2 AWS_DEFAULT_REGION=eu-west-2 AWS_ACCESS_KEY_ID="" AWS_SECRET_ACCESS_KEY="" AWS_SESSION_TOKEN="" pnpm run cdk:synth

      - name: 🔐 Checkov GitHub Action
        uses: bridgecrewio/checkov-action@c3e106d5f8f4253a6de5110efb41a080f83db294 # v12
        with:
          output_format: cli,sarif
          output_file_path: console,results.sarif
          soft_fail: true
          framework: cloudformation
          directory: infrastructure/cdk/cdk.out/
          config_file: .checkov.yaml
          quiet: true

      - name: ⚙️ Upload SARIF file
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: success() || failure()
        with:
          sarif_file: results.sarif
