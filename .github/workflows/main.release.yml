name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      semVer: ${{ steps.release.outputs.semVer }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: ⚙️ Configure AWS credentials (For package registry pulling)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          audience: sts.amazonaws.com
          role-to-assume: ${{ secrets.AWS_CODEARTIFACT_ROLE_ARN }}
          aws-region: eu-west-2

      - name: ⚙️ Configure Codeartifact
        run: aws codeartifact login --tool npm --repository registry-prod-repo --domain registry-prod --domain-owner ${{ secrets.AWS_CODEARTIFACT_ACCOUNT_ID }} --region eu-west-2

      - name: ⚙️ Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'

      - name: Install Dependencies
        run: pnpm ci

      - name: Run Semantic Release
        id: release
        run: pnpm run semantic:release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Version
        run: echo "The next version is ${{ steps.release.outputs.semVer }}"

  releaseToDev:
    needs: release
    name: Deploy to dev
    uses: ./.github/workflows/_deploy.yml
    with:
      ENVIRONMENT: dev
      VERSION: ${{needs.release.outputs.semVer}}@${{ github.sha }}
    secrets: inherit

  releaseStaging:
    needs: [release, releaseToDev]
    name: Deploy to staging
    uses: ./.github/workflows/_deploy.yml
    with:
      ENVIRONMENT: staging
      VERSION: ${{needs.release.outputs.semVer}}@${{ github.sha }}
    secrets: inherit

  releaseProduction:
    needs: [release, releaseToDev]
    name: Deploy to production
    uses: ./.github/workflows/_deploy.yml
    with:
      ENVIRONMENT: production
      VERSION: ${{needs.release.outputs.semVer}}@${{ github.sha }}
    secrets: inherit
