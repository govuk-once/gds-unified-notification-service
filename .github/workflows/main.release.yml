name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      semVer: ${{ steps.release.outputs.semVer }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: ⚙️ Setup
        uses: ./.github/actions/setup
        with:
          role-to-assume: ${{ secrets.AWS_CODEARTIFACT_ROLE_ARN }}
          codeartifact-account-id: ${{ secrets.AWS_CODEARTIFACT_ACCOUNT_ID }}

      - name: Run Semantic Release
        id: release
        run: pnpm run semantic:release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Version
        run: echo "The next version is ${{ steps.release.outputs.semVer }}"

  releaseToDev:
    needs: release
    name: Deploy to dev
    uses: ./.github/workflows/_deploy.yml
    with:
      ENVIRONMENT: dev
      VERSION: ${{needs.release.outputs.semVer}}@${{ github.sha }}
    secrets: inherit

  releaseStaging:
    needs: [release, releaseToDev]
    name: Deploy to staging
    uses: ./.github/workflows/_deploy.yml
    with:
      ENVIRONMENT: staging
      VERSION: ${{needs.release.outputs.semVer}}@${{ github.sha }}
    secrets: inherit

  releaseProduction:
    needs: [release, releaseToDev]
    name: Deploy to production
    uses: ./.github/workflows/_deploy.yml
    with:
      ENVIRONMENT: production
      VERSION: ${{needs.release.outputs.semVer}}@${{ github.sha }}
    secrets: inherit
