name: Testing E2E (for private Api Gateway)

permissions:
  contents: read
  id-token: write

on:
  workflow_call:
    inputs:
      ENVIRONMENT:
        description: 'Github environment to use'
        type: string
        required: true

jobs:
  test:
    name: E2E (Codebuild)
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.ENVIRONMENT }}
    env:
      SOURCE_BUCKET: uns-${{ vars.ENVIRONMENT_SHORTHAND }}-e2e-runner-builds
      PROJECT_NAME: uns-${{ vars.ENVIRONMENT_SHORTHAND }}-e2e-runner-project
    steps:
      - name: ⚙️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show OIDC claims (right before assume)
        if: ${{ runner.debug }}
        env:
          AUDIENCE: 'sts.amazonaws.com'
        run: |
          TOKEN_JSON=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE")
          ID_TOKEN=$(echo "$TOKEN_JSON" | jq -r .value)
          echo "$ID_TOKEN" | awk -F. '{print $2}' | base64 -d 2>/dev/null | jq -r '.sub'

      - name: ⚙️ Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          audience: sts.amazonaws.com
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: 📤 Upload source code for the e2e runner
        id: upload
        env:
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          zip -rqy source.zip . 
          SOURCE_KEY="e2e/${REF}/source-${SHA:0:7}-${RUN_NUMBER}.zip"
          aws s3 cp source.zip "s3://${SOURCE_BUCKET}/$SOURCE_KEY"
          echo "source_key=${SOURCE_KEY}" >> "$GITHUB_OUTPUT"

      - name: 🧪 Run e2e suite in Codebuild
        id: start
        env:
          SOURCE_KEY: ${{ steps.upload.outputs.source_key }}
        run: |
          BUILD_ID=$(aws codebuild start-build \
            --project-name "$PROJECT_NAME" \
            --source-location-override "${SOURCE_BUCKET}/${SOURCE_KEY}" \
            --query 'build.id' --output text)
          echo "build_id=${BUILD_ID}" >> "$GITHUB_OUTPUT"

      - name: ⌛ Wait for build to complete
        id: wait
        env:
          BUILD_ID: ${{ steps.start.outputs.build_id }}
        run: |
          STATUS="IN_PROGRESS"
          while [ "$STATUS" = "IN_PROGRESS" ]; do
            sleep 20
            STATUS=$(aws codebuild batch-get-builds --ids "$BUILD_ID" \
              --query 'builds[0].buildStatus' --output text)
          done

          echo "Build finished with status: ${STATUS}"
          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"

      - name: 📋 Reporting results
        env:
          STATUS: ${{ steps.wait.outputs.status }}
          BUILD_ID: ${{ steps.start.outputs.build_id }}
        run: |
          echo "::group::📝 View AWS CodeBuild Logs"
          aws logs tail /aws/codebuild/$PROJECT_NAME --log-stream-names "${BUILD_ID#*:}"
          echo "::endgroup::"

          echo "" 

          if [ "$STATUS" = "SUCCEEDED" ]; then
            echo "✅ E2E passed successfully!"
            exit 0
          else
            echo "::error::❌ Build failed with status: ${STATUS}"
            exit 1
          fi
