name: Run Unit Tests
description: Run unit tests with coverage and output a summary report

outputs:
  report:
    description: Coverage summary for PR comments
    value: ${{ steps.unittests.outputs.report }}

runs:
  using: composite
  steps:
    - name: 🧪 Run Unit tests & report coverage
      id: unittests
      shell: bash
      run: |
        echo "Test results:" > coverage.md
        echo '```' >> coverage.md
        (VITEST_TREE_REPORT=true pnpm run test:coverage 2>&1 | grep -A1000 "= Coverage summary =" | tee -a coverage.md) || echo "Failed to meet the criteria"
        echo '```' >> coverage.md

        echo 'report<<EOF' >> $GITHUB_OUTPUT
        cat coverage.md >> $GITHUB_OUTPUT
        echo 'EOF' >> $GITHUB_OUTPUT

    - name: ⬆️ Upload coverage artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      with:
        name: coverage.report
        path: ./coverage
