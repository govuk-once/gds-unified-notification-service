name: Setup Node.js & pnpm
description: Configure AWS CodeArtifact, install pnpm, Node.js, and project dependencies

inputs:
  role-to-assume:
    description: AWS IAM role ARN for CodeArtifact access
    required: true
  codeartifact-account-id:
    description: AWS account ID that owns the CodeArtifact domain
    required: true

runs:
  using: composite
  steps:
    - name: ⚙️ Configure AWS credentials (Codeartifact and Deployments)
      uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
      with:
        audience: sts.amazonaws.com
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: eu-west-2

    - name: ⚙️ Configure Codeartifact
      shell: bash
      run: aws codeartifact login --tool npm --repository registry-prod-repo --domain registry-prod --domain-owner ${{ inputs.codeartifact-account-id }} --region eu-west-2

    - name: ⚙️ Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: '.node-version'
        cache: 'pnpm'

    - name: ⚙️ Install Dependencies
      shell: bash
      run: pnpm ci
