openapi: 3.0.4
info:
  title: Unified Notification Service v0.1 - PSO
  version: 'v0.1'
  description: Work in progress

securitySchemes:
  MutualTLS:
    type: mutualTLS
    description: Mutual TLS authentication for secure API communication.
security:
  - MutualTLS: []

tags:
  - name: MVP
    description: Core feature sets that's currently enabled 
  - name: Groups
    description: Feature enabling sending notification to user groups with a single request (work in progress)

paths:
  /status:
    get:
      summary: Gets service status
      operationId: getStatus
      security: []
      tags:
        - MVP
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'

  /send:
    post:
      summary: Sends notifications
      operationId: postMessage
      tags:
        - MVP
      requestBody:
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 10
              items:
                $ref: '#/components/schemas/MessageRequest'
            example:
              - DepartmentID: 'DEP_1'
                NotificationTitle: 'Title 1'
                NotificationBody: 'Body 1'
                MessageTitle: 'Message Title 1'
                MessageBody: 'Message Body 1'
                NotificationID: 'c3d4e5f6-a7b8-4012-adef-123456789012'
                UserID: 'e5f6a7b8-c9d0-4234-adef-345678901234'
                Channel: 'PUSH_NOTIFICATION_AND_MESSAGE_CENTRE'
              - DepartmentID: 'DEP_2'
                NotificationTitle: 'Title 2'
                NotificationBody: 'Body 2'
                MessageTitle: 'Message Title 2'
                MessageBody: 'Message Body 2'
                NotificationID: 'd4e5f6a7-b8c9-4123-adef-234567890123'
                UserID: 'f6a7b8c9-d0e1-4345-adef-456789012345'
                Channel: 'PUSH_NOTIFICATION_AND_MESSAGE_CENTRE'
        required: true
      responses:
        '202':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                minItems: 1
                maxItems: 10
                items:
                  $ref: '#/components/schemas/MessageRequestResponse'
        '400':
          description: Bad Request Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'

  /v1/send-to-group:
    post:
      summary: Sends notifications to target group
      operationId: postGroupMessage
      tags:
        - Groups
      requestBody:
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 10
              items:
                $ref: '#/components/schemas/GroupMessageRequest'
            example:
              - GroupNotificationID: 'a1b2c3d4-e5f6-4789-abcd-ef0123456789'
                CampaignID: 'b2c3d4e5-f6a7-8901-bcde-f12345678901'
                Namespace: 'travel'
                Group: 'france'
                Subgroup: 'immediate'
                NotificationTitle: 'Title 1'
                NotificationBody: 'Body 1'
                MessageTitle: 'Message Title 1'
                MessageBody: 'Message Body 1'
              - GroupNotificationID: 'b2c3d4e5-f6a7-4890-abcd-f12345678902'
                CampaignID: 'b2c3d4e5-f6a7-8901-bcde-f12345678901'
                Namespace: 'travel'
                Group: 'spain'
                NotificationTitle: 'Title 2'
                NotificationBody: 'Body 2'
                MessageTitle: 'Message Title 2'
                MessageBody: 'Message Body 2'
        required: true
      responses:
        '202':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                minItems: 1
                maxItems: 10
                items:
                  $ref: '#/components/schemas/GroupMessageRequestResponse'
        '400':
          description: Bad Request Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'

  /status/{notificationID}:
    get:
      summary: Gets status of notification
      operationId: getNotificationStatus
      tags:
        - MVP
      parameters:
        - name: notificationID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                minItems: 1
                maxItems: 10
                items:
                  $ref: '#/components/schemas/MessageStatus'
        '400':
          description: Bad Request Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '404':
          description: Not Found Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'

  /status/campaign/{campaignID}:
    get:
      summary: Gets status of a campaign
      operationId: getCampaignStatus
      tags:
        - MVP
      parameters:
        - name: campaignID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignStatus'
        '400':
          description: Bad Request Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '404':
          description: Not Found Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'

components:
  schemas:
    Status:
      type: object
      required:
        - status
      properties:
        status:
          type: boolean
    MessageRequestProperties:
      type: object
      required:
        - NotificationTitle
        - NotificationBody
      properties:
        CampaignID:
          type: string
          description: (Optional) ID of the associated campaign
        NotificationTitle:
          type: string
          description: Title of the notification to be displayed on mobile device
        NotificationBody:
          type: string
          description: Contents of the notification to be displayed on push notification
        MessageTitle:
          type: string
          description: (Optional) Title of the message displayed in the GovUK app's notification centre, falls back on notification title
        MessageBody:
          type: string
          description: (Optional) Contents of the message displayed in the GovUK app's notification centre, falls back on notification body
        DeeplinkURL:
          type: string
          format: url
          description: (Optional) Explicit deeplink url to define for push notification - (Subject to feature flag being enabled)
        Channel:
          type: string
          enum:
            - PUSH_NOTIFICATION_AND_MESSAGE_CENTRE
            - MESSAGE_CENTRE_ONLY
          description: (Optional) Define which channel the notification is dispatched to
        ExpiresInDays:
          type: integer
          format: int32
          minimum: 1
          description: (Optional) Sets the number of days for a notification to be set to hidden, overriding the default amount
    MessageRequest:
      allOf:
        - $ref: '#/components/schemas/MessageRequestProperties'
        - type: object
          required:
            - UserID
          properties:
            DepartmentID:
              type: string
              description: (Optional) ID of department sending notification
            NotificationID:
              type: string
              description: ID of the notification to be used for idempotency & analytics, ID will be dynamically generated if one has not been supplied
              format: uuid
            UserID:
              type: string
              description: ID of the recipient fetched from UDP
    GroupMessageRequest:
      allOf:
        - $ref: '#/components/schemas/MessageRequestProperties'
        - type: object
          required:
            - Namespace
            - Group
          properties:
            GroupNotificationID:
              type: string
              description: (Optional) - Group Notification ID can be supplied in UUID form to guaranteed idempotency
              format: uuid
            Namespace:
              type: string
              description: Namespace name of the recipients
            Group:
              type: string
              description: Group name of the recipients
            Subgroup:
              type: string
              description: Group name of the recipients
    GroupMessageRequestResponse:
      type: object
      properties:
        GroupNotificationID:
          type: string
          format: uuid
        UsersInGroup:
          type: integer
          minimum: 0
    MessageRequestResponse:
      type: object
      properties:
        NotificationID:
          type: string
          format: uuid
    MessageStatus:
      type: object
      required:
        - NotificationID
        - EventDateTime
        - Status
      properties:
        NotificationID:
          type: string
        EventDateTime:
          type: string
        Status:
          type: string
          enum:
            - RECEIVED
            - VALIDATING
            - VALIDATED
            - VALIDATION_FAILED
            - PROCESSING
            - PROCESSED
            - PROCESSING_FAILED
            - DISPATCHING
            - DISPATCHED
            - DISPATCHING_FAILED
            - DELIVERED
            - NOTIFICATION_CENTRE_READ
            - NOTIFICATION_CENTRE_MARKED_AS_UNREAD
            - NOTIFICATION_CENTRE_HIDDEN
        Reason:
          type: string
          description: Provides addition context to the state
    CampaignStatus:
      type: object
      required:
        - CampaignID
        - DepartmentID
        - ProcessingSummary
        - UsageSummary
      properties:
        CampaignID:
          type: string
          description: ID of campaign
        DepartmentID:
          type: string
          description: ID of department who sent the campaign
        ProcessingSummary:
          type: object
          properties:
            RECEIVED:
              type: integer
            PROCESSED:
              type: integer
            DISPATCHED:
              type: integer
        UsageSummary:
          type: object
          properties:
            READ:
              type: integer
            MARKED_AS_UNREAD:
              type: integer
            HIDDEN:
              type: integer

    BaseError:
      type: object
      properties:
        Status:
          type: integer
        HttpError:
          type: string
        Errors:
          type: array
          minItems: 0
          maxItems: 100
          items:
            type: string

    BadRequestError:
      allOf:
        - $ref: '#/components/schemas/BaseError'
    UnauthorizedError:
      allOf:
        - $ref: '#/components/schemas/BaseError'
    NotFoundError:
      allOf:
        - $ref: '#/components/schemas/BaseError'
    ExpectationFailedError:
      allOf:
        - $ref: '#/components/schemas/BaseError'
    InternalServerError:
      allOf:
        - $ref: '#/components/schemas/BaseError'
